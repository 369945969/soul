<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Soul">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/api/icon/192">
  <title>Soul — AI 伴侣</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a2e;
      --text: #e0e0e8; --text2: #8888aa; --accent: #7c3aed;
      --accent2: #a78bfa; --green: #22c55e; --red: #ef4444;
      --yellow: #eab308; --blue: #3b82f6; --cyan: #06b6d4;
      --border: #2a2a3e; --glow: rgba(124, 58, 237, 0.3);
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    .header .logo { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header .status { margin-left: auto; display: flex; gap: 12px; align-items: center; }
    .header .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .header nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .header nav button { background: none; border: 1px solid transparent; color: var(--text2); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .header nav button:hover, .header nav button.active { background: var(--bg3); color: var(--text); border-color: var(--border); }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    @media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
    .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.3s; }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 14px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .card .value { font-size: 36px; font-weight: 700; }
    .stat-card { text-align: center; }
    .stat-card .icon { font-size: 28px; margin-bottom: 8px; }
    .memory-list { max-height: 500px; overflow-y: auto; }
    .memory-item { padding: 12px; border-bottom: 1px solid var(--border); transition: background 0.2s; }
    .memory-item:hover { background: var(--bg3); }
    .memory-item .type { font-size: 11px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
    .memory-item .type.knowledge { background: rgba(59,130,246,0.2); color: var(--blue); }
    .memory-item .type.wisdom { background: rgba(124,58,237,0.2); color: var(--accent2); }
    .memory-item .type.conversation { background: rgba(34,197,94,0.2); color: var(--green); }
    .memory-item .type.learning { background: rgba(234,179,8,0.2); color: var(--yellow); }
    .memory-item .content { font-size: 14px; line-height: 1.5; }
    .memory-item .meta { font-size: 12px; color: var(--text2); margin-top: 6px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-box input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 14px; outline: none; }
    .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .search-box button { background: var(--accent); border: none; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    .knowledge-item { padding: 10px 12px; border-left: 3px solid var(--accent); margin-bottom: 8px; background: var(--bg); border-radius: 0 8px 8px 0; }
    .knowledge-item .cat { font-size: 11px; color: var(--accent2); text-transform: uppercase; }
    .knowledge-item .title { font-weight: 600; margin: 4px 0; }
    .knowledge-item .conf { font-size: 12px; color: var(--text2); }
    .principle { padding: 16px; background: linear-gradient(135deg, var(--bg3), var(--bg2)); border-radius: 10px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
    .principle h4 { color: var(--accent2); margin-bottom: 6px; }
    .principle p { font-size: 14px; color: var(--text2); line-height: 1.5; }
    .empty { text-align: center; padding: 40px; color: var(--text2); }
    .empty .big { font-size: 48px; margin-bottom: 12px; }
    #brainCanvas { width: 100%; height: 400px; border-radius: 12px; background: var(--bg); cursor: grab; }
    #brainCanvas:active { cursor: grabbing; }
    .section { display: none; }
    .section.active { display: block; }
    .person-card { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--border); }
    .person-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: white; flex-shrink: 0; }
    .person-info .name { font-weight: 600; }
    .person-info .role { font-size: 12px; color: var(--text2); }
    .loading { text-align: center; padding: 40px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .digest-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .digest-row .label { color: var(--text2); font-size: 13px; }
    .digest-row .val { font-weight: 600; font-size: 14px; }
    .path-item { padding: 12px; border-bottom: 1px solid var(--border); }
    .path-item .progress-bar { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .path-item .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 3px; transition: width 0.5s; }
    .note-item { padding: 10px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
    .note-type { font-size: 20px; flex-shrink: 0; }
    .brain-fullscreen { position: fixed !important; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; border-radius: 0 !important; margin: 0; max-width: none; border: none !important; }
    .brain-fullscreen #brainCanvas { height: calc(100vh - 80px) !important; border-radius: 0; }
    .brain-node-highlight { animation: nodeHighlight 1.5s ease-in-out infinite; }
    @keyframes nodeHighlight { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(2); } }
    /* Login modal */
    .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; align-items: center; justify-content: center; }
    .login-overlay.hidden { display: none; }
    .login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 380px; max-width: 90vw; text-align: center; }
    .login-box .logo { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .login-box .sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px 16px; border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 12px; }
    .login-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
    .login-box .btn { width: 100%; background: var(--accent); border: none; color: white; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .login-box .btn:hover { background: #6d28d9; }
    .login-box .error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 20px; }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-overlay hidden">
    <div class="login-box">
      <div class="logo">Soul</div>
      <div class="sub">输入主人的密码短语以解锁</div>
      <input type="password" id="loginPass" placeholder="密码短语" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" onclick="doLogin()">解锁</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>
  <div class="header">
    <div class="logo">Soul</div>
    <nav>
      <button class="active" onclick="showSection('dashboard', this)">仪表板</button>
      <button onclick="showSection('brain', this)">大脑</button>
      <button onclick="showSection('memories', this)">记忆</button>
      <button onclick="showSection('knowledge', this)">知识</button>
      <button onclick="showSection('people', this)">人物</button>
      <button onclick="showSection('learning', this)">学习</button>
      <button onclick="showSection('notes', this)">笔记</button>
      <button onclick="showSection('philosophy', this)">理念</button>
    </nav>
    <a href="/chat" style="margin-left:8px;padding:6px 14px;border-radius:6px;background:var(--accent);border:1px solid var(--accent);color:white;text-decoration:none;font-size:13px;font-weight:600;transition:all 0.2s;" onmouseover="this.style.background='#6d28d9'" onmouseout="this.style.background='var(--accent)'">聊天</a>
    <a href="/office" style="padding:6px 14px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--accent2);text-decoration:none;font-size:13px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">办公</a>
    <a href="/community" style="padding:6px 14px;border-radius:6px;background:var(--bg3);border:1px solid var(--border);color:var(--accent2);text-decoration:none;font-size:13px;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">社区</a>
    <div class="status">
      <div class="status-dot"></div>
      <span id="statusText" style="font-size:13px;color:var(--text2)">加载中...</span>
      <span onclick="toggleTheme()" style="cursor:pointer;font-size:18px;margin-left:8px" title="切换主题">&#127763;</span>
    </div>
  </div>

  <div class="container">
    <div id="section-dashboard" class="section active">
      <div class="grid grid-4" style="margin-bottom:16px">
        <div class="card stat-card"><div class="icon">&#129504;</div><h3>记忆</h3><div class="value" id="stat记忆">-</div></div>
        <div class="card stat-card"><div class="icon">&#128218;</div><h3>知识</h3><div class="value" id="stat知识">-</div></div>
        <div class="card stat-card"><div class="icon">&#128187;</div><h3>代码
